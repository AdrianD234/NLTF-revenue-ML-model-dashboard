# Change-scope taxonomy for the tiered CI system.
#
# scripts/ci_plan.py reads this file, classifies a diff into scopes, and emits
# the test groups, pack checks and hosted jobs that diff actually requires.
#
# Two rules govern how this file is read, and both are fail-safe:
#
#   * Scopes UNION. A file may match several rules; every matching scope
#     applies. Requirements are the union across matched scopes, so nothing is
#     lost by a file being classified more than once.
#
#   * Anything unmatched becomes unknown_high_risk. A new directory, a new
#     top-level file or a rename nobody taught this file about escalates to
#     full assurance rather than quietly selecting no tests.
#
# `docs_only` is the one scope that can lower the bill, and it can only do so
# when EVERY changed file is docs. One source file in the diff removes it.

version: 1

# ---------------------------------------------------------------------------
# Named pytest selections. Groups are referenced by scopes below; ci_plan.py
# validates that every path here still exists, so a renamed test file fails the
# planner tests instead of silently selecting nothing.
# ---------------------------------------------------------------------------
test_groups:

  planner:
    description: The change classifier's own tests.
    paths:
      - tests/test_ci_plan.py

  import_smoke:
    description: Import surface and cold-start smoke; cheap, always worth running.
    paths:
      - tests/test_streamlit_cloud_import_surface.py
      - tests/test_streamlit_smoke.py

  dashboard_ui:
    description: Widget state, filters, hovers, tooltips and executive mode.
    paths:
      - tests/test_streamlit_widget_state.py
      - tests/test_filters_are_clickable.py
      - tests/test_filter_and_hover.py
      - tests/test_hovers_are_readable.py
      - tests/test_reset_filters.py
      - tests/test_summary_tooltips.py
      - tests/test_executive_mode.py
      - tests/test_management_model_hovers.py
      - tests/test_diagnostic_matrix_tooltips.py
      - tests/test_scenario_comparison.py

  revenue_outlook_presentation:
