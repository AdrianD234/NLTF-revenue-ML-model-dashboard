      - tests/test_completion_evidence_artifacts.py

  repo_hygiene:
    description: >
      Tests that scan the repository's own source tree - banned user roots,
      historical git objects, legacy pack paths. Any script or module change
      can trip these, so they run whenever tooling moves.
    paths:
