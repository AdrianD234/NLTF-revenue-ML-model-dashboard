      - tests/test_revenue_outlook_series_coverage.py
      - tests/test_revenue_outlook_ped_activity_2050.py
      - tests/test_revenue_scenario_key.py
      - tests/test_rate_paths.py
      - tests/test_npv.py
      - tests/test_ev_uptake_levers.py
      - tests/test_fleet_mix.py
      - tests/test_eruc_transition.py
      - tests/test_fuel_price_scenario.py
      - tests/test_light_fleet_allocation.py
      - tests/test_long_run_shape_transition.py
      - tests/test_treasury_macro_paths.py
      - tests/test_net_revenue_timing_comparison.py
      - tests/test_quarterly_disaggregation.py
      - tests/test_conflict_fuel_paths.py
      - tests/test_conflict_gdp_paths.py
      - tests/test_vfm_long_run_composition.py
      - tests/test_revenue_outlook_vfm_envelope.py
