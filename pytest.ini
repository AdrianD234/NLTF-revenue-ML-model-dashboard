[pytest]
markers =
    e2e: browser end-to-end tests that require a running Streamlit server
    slow: re-runs the reference pipeline to prove a materialised pack equals it.
        Deselect with -m "not slow" for a fast loop; CI runs them, because a
        materialisation nobody compares to its reference is just a cache.
    requires_local_scratch: needs developer-local scratch under artifacts/ that
        cannot be rebuilt from committed content (screenshots, manual audit
        logs). These do not constitute clean-clone assurance and are deselected
        in the core CI job, which states how many were excluded and why.
    exhaustive_runtime_parity: walks ALL 121 materialised policy states per
        engine against a fresh reference-pipeline run (726 overlay runs). On a
        2-CPU hosted runner this alone exceeds the full-assurance budget, so
        the hosted core job deselects it and runs the stratified 21-pair
        representative parity test instead; local full assurance
        (scripts/ci_local.ps1 -Tier full) and the pack builder both still run
        the complete 121-state comparison, and the hosted job states the
        exclusion in its coverage report.
testpaths = tests
addopts = -m "not e2e" -p no:cacheprovider

